<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phrasal Verbs — Quiz · C1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E7E9EC;
    --card:#F5F6F8;
    --ink:#16212B;
    --ink-soft:#5A6573;
    --ink-faint:#8A929C;
    --amber:#A65F0B;
    --amber-wash:#F3E2C2;
    --teal:#1C6B62;
    --teal-wash:#D8EBE7;
    --red:#A8341F;
    --red-wash:#F2DDD7;
    --line:#D3D8DD;
    --line-soft:#E1E5E9;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:"Space Grotesk",system-ui,sans-serif;line-height:1.5;
    -webkit-font-smoothing:antialiased;min-height:100vh;
  }
  .wrap{max-width:620px;margin:0 auto;padding:40px 22px 80px;}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px;}
  .back{font-size:13px;color:var(--ink-soft);text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
  .back:hover{color:var(--teal);}
  .eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;}

  h1{margin:0;font-weight:700;letter-spacing:-.025em;font-size:clamp(30px,7vw,44px);line-height:1.03;}
  h1 .accent{color:var(--teal);}

  .screen{display:none;}
  .screen.on{display:block;}

  /* ---- start ---- */
  .lead{font-family:"Newsreader",Georgia,serif;font-size:19px;color:var(--ink-soft);margin:14px 0 30px;max-width:46ch;}
  .lead em{font-style:normal;color:var(--amber);font-weight:600;}
  .field{margin:0 0 24px;}
  .field-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin:0 0 10px;}
  .opts{display:flex;gap:9px;flex-wrap:wrap;}
  .seg{
    cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
    border-radius:10px;padding:11px 16px;font-family:inherit;font-size:14px;font-weight:500;transition:.12s;
  }
  .seg:hover{border-color:var(--ink-faint);color:var(--ink);}
  .seg[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .seg small{display:block;font-size:11px;font-weight:400;opacity:.7;margin-top:2px;}

  .start-btn{
    margin-top:8px;width:100%;cursor:pointer;border:0;border-radius:12px;
    background:var(--teal);color:#fff;font-family:inherit;font-weight:600;font-size:16px;
    padding:16px;letter-spacing:.01em;transition:.14s;
  }
  .start-btn:hover{background:#155952;}

  /* ---- quiz ---- */
  .progress-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--ink-faint);letter-spacing:.04em;font-weight:600;text-transform:uppercase;margin-bottom:10px;}
  .bar{height:4px;background:var(--line-soft);border-radius:999px;overflow:hidden;margin-bottom:30px;}
  .bar span{display:block;height:100%;background:var(--amber);width:0;transition:width .3s ease;}

  .ask{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin:0 0 12px;}
  .prompt{font-family:"Newsreader",Georgia,serif;font-size:clamp(26px,7vw,36px);font-weight:500;line-height:1.2;margin:0 0 28px;}
  .prompt.verb{font-family:"Space Grotesk",sans-serif;font-weight:600;letter-spacing:-.01em;}
  .prompt .part{color:var(--amber);}

  .choices{display:flex;flex-direction:column;gap:10px;}
  .choice{
    text-align:left;cursor:pointer;border:1px solid var(--line);background:var(--card);
    border-radius:12px;padding:15px 17px;font-family:inherit;font-size:15.5px;color:var(--ink);
    transition:.1s;line-height:1.4;display:flex;gap:12px;align-items:flex-start;
  }
  .choice .key{flex:0 0 auto;font-size:12px;font-weight:600;color:var(--ink-faint);
    border:1px solid var(--line);border-radius:6px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .choice .txt{flex:1;}
  .choice .txt .part{color:var(--amber);font-weight:600;}
  .choice:hover:not(:disabled){border-color:var(--ink-faint);}
  .choice:disabled{cursor:default;}
  .choice.correct{background:var(--teal-wash);border-color:var(--teal);color:#0f4a44;}
  .choice.correct .key{border-color:var(--teal);color:var(--teal);}
  .choice.wrong{background:var(--red-wash);border-color:var(--red);color:#7a2515;}
  .choice.wrong .key{border-color:var(--red);color:var(--red);}
  .choice.dim{opacity:.5;}

  .next{
    margin-top:24px;cursor:pointer;border:0;border-radius:12px;background:var(--ink);color:var(--paper);
    font-family:inherit;font-weight:600;font-size:15px;padding:14px 26px;visibility:hidden;transition:.14s;
  }
  .next:hover{background:#0c161e;}
  .next.show{visibility:visible;}

  /* ---- result ---- */
  .score{font-weight:700;font-size:clamp(56px,18vw,84px);line-height:1;letter-spacing:-.03em;margin:8px 0 4px;}
  .score em{font-style:normal;color:var(--teal);}
  .score .of{color:var(--ink-faint);font-weight:500;font-size:.45em;}
  .verdict{font-family:"Newsreader",serif;font-size:20px;color:var(--ink-soft);margin:0 0 32px;}
  .rev-head{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;border-bottom:1px solid var(--line);padding-bottom:8px;margin:32px 0 0;}
  .rev{padding:16px 0;border-bottom:1px solid var(--line-soft);}
  .rev .v{font-size:17px;font-weight:600;letter-spacing:-.01em;}
  .rev .v .part{color:var(--amber);}
  .rev .d{color:var(--ink-soft);font-size:14px;margin-top:3px;}
  .rev .yours{color:var(--red);font-size:13px;margin-top:6px;}
  .clean{font-family:"Newsreader",serif;font-size:17px;color:var(--ink-soft);padding:18px 0;}
  .result-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px;}
  .btn-2{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);
    font-family:inherit;font-weight:600;font-size:15px;padding:13px 22px;border-radius:12px;transition:.12s;}
  .btn-2:hover{border-color:var(--ink-faint);}
  .btn-2.primary{background:var(--teal);color:#fff;border-color:var(--teal);}
  .btn-2.primary:hover{background:#155952;}

  .hint{font-size:12px;color:var(--ink-faint);margin-top:26px;text-align:center;letter-spacing:.02em;}

  :focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:10px;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      Toolkit
    </a>
    <span class="eyebrow">Self-test · C1</span>
  </div>

  <!-- START -->
  <section class="screen on" id="start">
    <h1>Phrasal verbs <span class="accent">quiz</span></h1>
    <p class="lead">Multiple choice, drawn at random from <em>154</em> phrasal verbs. Pick a length and a direction to begin.</p>

    <div class="field">
      <p class="field-label">Length</p>
      <div class="opts" id="lenOpts">
        <button class="seg" data-len="10" aria-pressed="true">10</button>
        <button class="seg" data-len="20" aria-pressed="false">20</button>
        <button class="seg" data-len="30" aria-pressed="false">30</button>
        <button class="seg" data-len="all" aria-pressed="false">All 154</button>
      </div>
    </div>

    <div class="field">
      <p class="field-label">Direction</p>
      <div class="opts" id="dirOpts">
        <button class="seg" data-dir="v2m" aria-pressed="true">Verb → meaning<small>see the verb, pick the meaning</small></button>
        <button class="seg" data-dir="m2v" aria-pressed="false">Meaning → verb<small>see the meaning, pick the verb</small></button>
        <button class="seg" data-dir="mix" aria-pressed="false">Mixed<small>both, at random</small></button>
      </div>
    </div>

    <button class="start-btn" id="startBtn">Start quiz</button>
    <p class="hint">Tip: answer with keys 1–4, then Enter to continue.</p>
  </section>

  <!-- QUIZ -->
  <section class="screen" id="quiz">
    <div class="progress-row">
      <span id="qcount">Question 1 / 10</span>
      <span id="qscore">Score 0</span>
    </div>
    <div class="bar"><span id="barFill"></span></div>

    <p class="ask" id="ask">Which meaning fits?</p>
    <p class="prompt" id="prompt"></p>
    <div class="choices" id="choices"></div>
    <button class="next" id="nextBtn">Next →</button>
  </section>

  <!-- RESULT -->
  <section class="screen" id="result">
    <h1>Done<span class="accent">.</span></h1>
    <p class="score" id="scoreBig"></p>
    <p class="verdict" id="verdict"></p>
    <div id="review"></div>
    <div class="result-actions">
      <button class="btn-2 primary" id="againBtn">New quiz</button>
      <button class="btn-2" id="retryBtn">Retry the misses</button>
    </div>
  </section>
</div>

<script>
const DATA = [["ask out", "to invite someone on a romantic date"], ["back down", "to withdraw from a position or argument"], ["back up", "to support someone; to make a copy of data"], ["blow up", "to explode; to become very angry"], ["break away", "to escape or leave a group suddenly"], ["break down", "to stop functioning; to lose emotional control"], ["break into", "to enter a place by force; to start doing suddenly"], ["break off", "to end something suddenly"], ["break out", "to escape; to begin suddenly"], ["break up", "to end a relationship; to separate into pieces"], ["bring about", "to cause something to happen"], ["bring back", "to return something; to remind of the past"], ["bring forward", "to move an event to an earlier time"], ["bring up", "to mention a topic; to raise a child"], ["burn out", "to exhaust oneself through overwork"], ["call back", "to return a phone call"], ["call off", "to cancel something that was planned"], ["call up", "to telephone someone"], ["calm down", "to become less agitated or upset"], ["carry on", "to continue doing something"], ["catch on", "to understand; to become popular"], ["catch up", "to reach the same level as others"], ["check in", "to register at a hotel or airport"], ["check out", "to leave a hotel; to examine something closely"], ["clean up", "to tidy a place"], ["clear out", "to empty a space of its contents"], ["close down", "to cease operation permanently"], ["come across", "to find or meet someone by chance"], ["come back", "to return to a place"], ["come down", "to decrease; to travel south"], ["come in", "to enter a place; to arrive"], ["come out", "to be published; to reveal one's identity"], ["come up with", "to think of an idea or plan"], ["count on", "to rely on someone or something"], ["cross out", "to draw a line through something to cancel it"], ["cut back", "to reduce spending or consumption"], ["cut down", "to reduce the amount of something; to fell a tree"], ["cut off", "to stop abruptly; to interrupt someone"], ["cut out", "to stop doing something; to remove by cutting"], ["deal with", "to handle or take action about something"], ["die out", "to become extinct or gradually disappear"], ["do away with", "to abolish or eliminate something"], ["do up", "to fasten clothing; to renovate a building"], ["draw up", "to prepare a formal document"], ["drop out", "to leave school or a course before finishing"], ["eat out", "to have a meal in a restaurant"], ["end up", "to reach a final state or place unexpectedly"], ["face up to", "to accept and deal with something difficult"], ["fall apart", "to break into pieces; to fail completely"], ["fall behind", "to fail to keep pace with others"], ["fall out", "to quarrel with someone; to have a disagreement"], ["feel up to", "to feel capable of doing something"], ["figure out", "to understand or find a solution to something"], ["fill in", "to complete a form; to substitute for someone"], ["find out", "to discover or learn new information"], ["get across", "to communicate an idea successfully"], ["get ahead", "to make progress or succeed in life"], ["get along", "to have a good relationship with someone"], ["get away", "to escape; to go on a short holiday"], ["get back", "to return to a place; to recover something"], ["get by", "to manage with limited money or resources"], ["get down", "to depress someone; to descend from something"], ["get in", "to enter a vehicle or building; to arrive"], ["get off", "to leave a vehicle; to avoid punishment"], ["get on", "to board a vehicle; to make progress; to have a good relationship"], ["get out", "to leave a place; to escape"], ["get over", "to recover from an illness or disappointment"], ["get through", "to finish a task; to make contact with someone"], ["get up", "to rise from bed; to stand up"], ["give away", "to give something for free; to reveal a secret"], ["give back", "to return something to its owner"], ["give in", "to stop resisting; to surrender"], ["give out", "to distribute to a group; to run out of energy"], ["give up", "to stop trying; to quit something"], ["go ahead", "to proceed with a plan or action"], ["go back", "to return to a place or previous topic"], ["go down", "to decrease; to be remembered in history"], ["go off", "to explode; to ring an alarm; to go bad"], ["go on", "to continue; to happen or take place"], ["go out", "to leave the house to socialise; to be extinguished"], ["go over", "to review or examine something carefully"], ["go through", "to experience difficulty; to examine thoroughly"], ["go up", "to increase in amount; to be constructed"], ["grow on", "to become more liked or appreciated over time"], ["grow up", "to develop from a child into an adult"], ["hang on", "to wait a moment; to hold something tightly"], ["hand in", "to submit work or an assignment"], ["hang up", "to end a phone call; to hang clothing on a hook"], ["have on", "to be wearing something; to have something planned"], ["head off", "to intercept; to prevent something from happening"], ["hold back", "to restrain oneself or someone else; to hesitate"], ["hold on", "to wait; to grip something tightly"], ["hold up", "to delay; to rob; to remain strong under pressure"], ["hurry up", "to move or act more quickly"], ["keep away", "to stay or make someone stay at a distance"], ["keep on", "to continue doing something persistently"], ["keep up", "to maintain the same speed or standard"], ["knock out", "to make someone unconscious by a blow"], ["leave out", "to omit or not include something"], ["let down", "to disappoint someone who trusted you"], ["let in", "to allow someone to enter a place"], ["let out", "to release someone; to make a garment larger"], ["light up", "to illuminate a place; to brighten with happiness"], ["line up", "to arrange in a row; to queue"], ["live up to", "to meet expectations or standards set"], ["look after", "to take care of a person or thing"], ["look around", "to explore or examine an area"], ["look at", "to direct one's gaze at something"], ["look forward to", "to anticipate something with pleasure"], ["look into", "to investigate or research something"], ["look out", "to be careful; to watch for danger"], ["look up", "to search for information; to improve"], ["make out", "to manage; to understand; to see with difficulty"], ["make over", "to completely change the appearance of something"], ["make up", "to invent a story; to reconcile after a quarrel"], ["meet up", "to meet someone by prior arrangement"], ["mix up", "to confuse two things; to blend together"], ["move on", "to stop dwelling on the past and progress forward"], ["open up", "to become less reserved; to start operating"], ["pass out", "to faint; to hand something to several people"], ["pay back", "to repay money or a favour owed"], ["pay off", "to repay a debt fully; to yield good results"], ["phase out", "to gradually discontinue something"], ["pick up", "to collect someone; to learn a skill informally"], ["play down", "to make something seem less important than it is"], ["point out", "to draw attention to a fact or problem"], ["pull off", "to succeed in doing something difficult"], ["put away", "to store something in its proper place"], ["put back", "to return something to its original place"], ["put down", "to place something on a surface; to criticise"], ["put off", "to postpone; to cause dislike or loss of interest"], ["put on", "to dress in clothing; to pretend; to gain weight"], ["put out", "to extinguish a fire; to inconvenience someone"], ["put up with", "to tolerate something or someone unpleasant"], ["read out", "to read something aloud to others"], ["run away", "to flee from a place or person"], ["run into", "to meet someone unexpectedly"], ["run out of", "to use all of something so none remains"], ["save up", "to accumulate money gradually over time"], ["set off", "to begin a journey; to cause something to start"], ["set up", "to arrange or establish something"], ["show off", "to boast about or display something proudly"], ["shut down", "to stop a machine or operation"], ["sort out", "to resolve a problem or organise things neatly"], ["speed up", "to go or do something faster"], ["stand out", "to be clearly noticeable or better than others"], ["step down", "to resign from a position or responsibility"], ["sum up", "to summarise the main points of something"], ["take off", "to remove clothing; to become suddenly successful"], ["take on", "to accept a responsibility or task"], ["take over", "to take control of something"], ["turn down", "to reject an offer; to lower the volume"], ["wear out", "to exhaust someone; to make unusable through use"], ["work out", "to exercise; to calculate; to result successfully"]];

// ---- helpers ----
const $ = id => document.getElementById(id);
const firstSense = d => d.split(';')[0].trim();
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function markPart(v){
  const t=v.split(' ');
  return esc(t[0])+' <span class="part">'+esc(t.slice(1).join(' '))+'</span>';
}
function capFirst(s){return s.charAt(0).toUpperCase()+s.slice(1);}

// ---- state ----
let cfg={len:10,dir:'v2m'};
let deck=[], qi=0, score=0, answered=false, wrong=[];

// ---- settings UI ----
$('lenOpts').addEventListener('click',e=>{
  const b=e.target.closest('.seg'); if(!b)return;
  [...$('lenOpts').children].forEach(x=>x.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true');
  cfg.len = b.dataset.len==='all' ? 'all' : parseInt(b.dataset.len,10);
});
$('dirOpts').addEventListener('click',e=>{
  const b=e.target.closest('.seg'); if(!b)return;
  [...$('dirOpts').children].forEach(x=>x.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true');
  cfg.dir=b.dataset.dir;
});

function show(id){
  ['start','quiz','result'].forEach(s=>$(s).classList.toggle('on',s===id));
  window.scrollTo({top:0,behavior:'auto'});
}

function buildDeck(pool){
  const source = pool || DATA.map(([v,d])=>({verb:v,def:d}));
  const picked = shuffle(source.slice());
  const n = cfg.len==='all' ? picked.length : Math.min(cfg.len,picked.length);
  deck = picked.slice(0,n).map(item=>{
    const dir = cfg.dir==='mix' ? (Math.random()<0.5?'v2m':'m2v') : cfg.dir;
    return makeQ(item,dir);
  });
}

function makeQ(item,dir){
  if(dir==='v2m'){
    const correct=firstSense(item.def);
    const pool=DATA.filter(([v])=>v!==item.verb).map(([,d])=>firstSense(d));
    const opts=pickOpts(correct,pool);
    return {dir, prompt:item.verb, ask:'Which meaning fits?', promptIsVerb:true,
            correct, options:opts, verb:item.verb, def:correct};
  }else{
    const correct=item.verb;
    const pool=DATA.filter(([v])=>v!==item.verb).map(([v])=>v);
    const opts=pickOpts(correct,pool);
    return {dir, prompt:capFirst(firstSense(item.def)), ask:'Which verb means this?', promptIsVerb:false,
            correct, options:opts, optsAreVerbs:true, verb:item.verb, def:firstSense(item.def)};
  }
}

function pickOpts(correct,pool){
  const distract=[];
  const shuffled=shuffle([...new Set(pool)].filter(x=>x!==correct));
  for(const x of shuffled){ if(distract.length>=3)break; distract.push(x); }
  return shuffle([correct,...distract]);
}

function renderQ(){
  const q=deck[qi];
  answered=false;
  $('qcount').textContent=`Question ${qi+1} / ${deck.length}`;
  $('qscore').textContent=`Score ${score}`;
  $('barFill').style.width=`${(qi/deck.length)*100}%`;
  $('ask').textContent=q.ask;
  $('prompt').className='prompt'+(q.promptIsVerb?' verb':'');
  $('prompt').innerHTML=q.promptIsVerb?markPart(q.prompt):esc(q.prompt);

  const keys=['1','2','3','4'];
  $('choices').innerHTML=q.options.map((opt,i)=>{
    const label=q.optsAreVerbs?markPart(opt):esc(capFirst(opt));
    return `<button class="choice" data-i="${i}" data-val="${esc(opt)}">
      <span class="key">${keys[i]}</span><span class="txt">${label}</span></button>`;
  }).join('');
  $('nextBtn').classList.remove('show');
}

function answer(btn){
  if(answered)return;
  answered=true;
  const q=deck[qi];
  const chosen=btn.dataset.val;
  const buttons=[...$('choices').querySelectorAll('.choice')];
  buttons.forEach(b=>{
    b.disabled=true;
    if(b.dataset.val===q.correct) b.classList.add('correct');
    else if(b===btn) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  if(chosen===q.correct){ score++; $('qscore').textContent=`Score ${score}`; }
  else { wrong.push({verb:q.verb,def:q.def,your:chosen,yourIsVerb:!!q.optsAreVerbs}); }
  $('nextBtn').classList.add('show');
  $('nextBtn').focus();
}

$('choices').addEventListener('click',e=>{
  const b=e.target.closest('.choice'); if(b)answer(b);
});

$('nextBtn').addEventListener('click',()=>{
  qi++;
  if(qi>=deck.length) finish();
  else renderQ();
});

function finish(){
  const pct=Math.round((score/deck.length)*100);
  $('barFill').style.width='100%';
  $('scoreBig').innerHTML=`<em>${score}</em><span class="of"> / ${deck.length}</span>`;
  let msg;
  if(pct===100) msg="Faultless — you own these.";
  else if(pct>=80) msg="Strong work, just a few to tidy up.";
  else if(pct>=60) msg="A solid base. Review the misses below.";
  else if(pct>=40) msg="Getting there — worth another round.";
  else msg="Early days. Try the lexicon, then come back.";
  $('verdict').textContent=`${msg} (${pct}%)`;

  if(wrong.length){
    $('review').innerHTML=`<p class="rev-head">Worth another look · ${wrong.length}</p>`+
      wrong.map(w=>`<div class="rev">
        <div class="v">${markPart(w.verb)}</div>
        <div class="d">${esc(capFirst(w.def))}</div>
        <div class="yours">You chose: ${w.yourIsVerb?markPart(w.your):esc(capFirst(w.your))}</div>
      </div>`).join('');
  }else{
    $('review').innerHTML=`<p class="clean">Clean sweep — nothing to review.</p>`;
  }
  show('result');
}

$('startBtn').addEventListener('click',()=>{
  score=0;qi=0;wrong=[];
  buildDeck();
  renderQ();
  show('quiz');
});
$('againBtn').addEventListener('click',()=>show('start'));
$('retryBtn').addEventListener('click',()=>{
  if(!wrong.length){show('start');return;}
  const pool=wrong.map(w=>{
    const full=DATA.find(([v])=>v===w.verb);
    return {verb:full[0],def:full[1]};
  });
  score=0;qi=0;
  const savedLen=cfg.len; cfg.len='all';
  buildDeck(pool);
  cfg.len=savedLen;
  wrong=[];
  renderQ();
  show('quiz');
});

// keyboard
document.addEventListener('keydown',e=>{
  if(!$('quiz').classList.contains('on'))return;
  const map={'1':0,'2':1,'3':2,'4':3};
  if(e.key in map && !answered){
    const b=$('choices').querySelector(`[data-i="${map[e.key]}"]`);
    if(b)b.click();
  }
  if(e.key==='Enter' && answered) $('nextBtn').click();
});
</script>
</body>
</html>
