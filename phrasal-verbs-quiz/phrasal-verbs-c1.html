const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function splitVerb(v){const parts=v.split(" ");return {stem:parts.slice(0,-1).join(" "),part:parts.slice(-1)[0]};}

function markSentence(sentence, mark){
  const i = sentence.toLowerCase().indexOf(mark.toLowerCase());
  if(i<0) return esc(sentence);
  const before = sentence.slice(0,i), hit = sentence.slice(i,i+mark.length), after = sentence.slice(i+mark.length);
  return esc(before)+'<span class="mk">'+esc(hit)+'</span>'+esc(after);
}

let query = "", allRevealed = false;

function filtered(){
  if(!query) return DATA;
  const q = query.toLowerCase();
  return DATA.filter(d=>d.verb.toLowerCase().includes(q) || d.def.toLowerCase().includes(q) || d.sentence.toLowerCase().includes(q));
}

function render(){
  const rows = filtered();
  $('count').textContent = rows.length+" of "+DATA.length+" entries";
  const L = $('list');
  if(!rows.length){
    L.innerHTML = '<div class="empty"><b>No matches</b>Try a different word, or clear the search.</div>';
    return;
  }
  L.innerHTML = rows.map((d,i)=>{
    const {stem,part} = splitVerb(d.verb);
    return '<div class="card">'
      + '<p class="hw">'+esc(stem)+' <span class="part">'+esc(part)+'</span></p>'
      + '<p class="sentence">'+markSentence(d.sentence, d.mark)+'</p>'
      + '<p class="meaning'+(allRevealed?' revealed':'')+'" data-i="'+i+'">'
      +   '<span class="lab">Meaning</span><span class="txt">'+esc(d.def)+'</span>'
      + '</p>'
      + '</div>';
  }).join('');
}

$('q').addEventListener('input', e=>{ query = e.target.value; render(); });

$('revealAll').addEventListener('click', ()=>{
  allRevealed = !allRevealed;
  $('revealAll').setAttribute('aria-pressed', String(allRevealed));
  $('revealAll').textContent = allRevealed ? 'Hide all' : 'Reveal all';
  render();
});

$('list').addEventListener('click', e=>{
  const m = e.target.closest('.meaning');
  if(m) m.classList.toggle('revealed');
});

render();
</script>
