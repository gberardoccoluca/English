<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phrasal Verbs — Lexicon · C1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E7E9EC;
    --card:#F5F6F8;
    --ink:#16212B;
    --ink-soft:#5A6573;
    --ink-faint:#8A929C;
    --amber:#A65F0B;
    --amber-wash:#F3E2C2;
    --teal:#1C6B62;
    --line:#D3D8DD;
    --line-soft:#E1E5E9;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:"Space Grotesk",system-ui,sans-serif;line-height:1.5;
    -webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:60px;
  }
  .wrap{max-width:720px;margin:0 auto;padding:0 22px;}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:24px 0 0;}
  .back{font-size:13px;color:var(--ink-soft);text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
  .back:hover{color:var(--teal);}
  .eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;}

  header{padding:14px 0 22px;}
  h1{margin:0;font-weight:700;letter-spacing:-.025em;line-height:1.02;font-size:clamp(30px,7vw,44px);}
  h1 .accent{color:var(--teal);}
  .tag{font-family:"Newsreader",Georgia,serif;font-size:17px;color:var(--ink-soft);max-width:48ch;margin:12px 0 0;}

  .controls{position:sticky;top:0;z-index:5;background:var(--paper);padding:16px 0 12px;border-bottom:1px solid var(--line);}
  .searchrow{display:flex;gap:10px;align-items:center;}
  .search{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:12px 15px;}
  .search:focus-within{border-color:var(--ink-faint);}
  .search input{border:0;background:transparent;outline:0;width:100%;
    font-family:inherit;font-size:15px;color:var(--ink);}
  .search svg{flex:none;stroke:var(--ink-faint);}
  .modebtn{font-family:inherit;font-size:14px;font-weight:600;
    background:var(--ink);color:var(--paper);border:0;
    padding:12px 18px;border-radius:12px;cursor:pointer;white-space:nowrap;transition:.14s;}
  .modebtn:hover{background:var(--teal);}
  .count{font-size:12px;color:var(--ink-faint);letter-spacing:.03em;margin:12px 0 0;font-weight:500;}

  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 0;}
  .chip{font-family:inherit;font-size:12.5px;letter-spacing:.01em;
    background:var(--card);border:1px solid var(--line);color:var(--ink-soft);
    padding:6px 12px;border-radius:100px;cursor:pointer;transition:.1s;}
  .chip:hover{border-color:var(--ink-faint);color:var(--ink);}
  .chip.on{background:var(--amber);border-color:var(--amber);color:#fff;}
  .chip .n{opacity:.65;margin-left:.4em;}

  /* browse list */
  .list{margin:8px 0 0;}
  .entry{padding:16px 0;border-bottom:1px solid var(--line-soft);}
  .hw{font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:20px;letter-spacing:-.01em;}
  .hw .stem{color:var(--ink);}
  .hw .part{color:var(--amber);font-weight:700;}
  .def{color:var(--ink-soft);font-size:14.5px;margin-top:3px;}
  .def .alt{color:var(--line);margin:0 .4em;}
  mark{background:var(--amber-wash);color:var(--ink);padding:0 .15em;border-radius:3px;}
  .empty{padding:50px 0;text-align:center;color:var(--ink-soft);}
  .empty b{display:block;font-family:"Newsreader",serif;font-size:20px;color:var(--ink);margin-bottom:6px;}

  /* study mode */
  .study{margin:22px 0 0;display:none;flex-direction:column;align-items:center;}
  .study.on{display:flex;}
  .cardstage{width:100%;max-width:480px;perspective:1400px;}
  .flip{position:relative;width:100%;aspect-ratio:3/2;cursor:pointer;
    transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,.1,.2,1);}
  .flip.flipped{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);
    border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 40px -24px rgba(22,33,43,.35);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;}
  .face.back{transform:rotateY(180deg);background:var(--ink);border-color:var(--ink);}
  .face .lab{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);
    font-weight:600;position:absolute;top:16px;left:18px;}
  .face.back .lab{color:var(--teal-wash,#9fd3cb);}
  .cardhw{font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:2.1rem;line-height:1.1;}
  .cardhw .part{color:var(--amber);font-weight:700;}
  .carddef{color:#e9edf0;font-size:1.15rem;font-family:"Newsreader",Georgia,serif;line-height:1.4;}
  .hint{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);position:absolute;bottom:16px;}
  .face.back .hint{color:#8aa39e;}
  .nav{display:flex;align-items:center;gap:16px;margin:22px 0 6px;}
  .nav button{font-family:inherit;font-size:14px;font-weight:600;background:transparent;
    border:1px solid var(--ink);color:var(--ink);padding:10px 18px;border-radius:10px;cursor:pointer;transition:.12s;}
  .nav button:hover{background:var(--ink);color:var(--paper);}
  .nav .pos{font-size:13px;color:var(--ink-soft);min-width:5.5rem;text-align:center;}
  .shuffle{font-family:inherit;font-size:13px;font-weight:600;letter-spacing:.02em;
    background:transparent;border:0;color:var(--teal);cursor:pointer;padding:6px;border-bottom:1px solid var(--teal);}
  @media(max-width:520px){.cardhw{font-size:1.7rem;}.carddef{font-size:1.02rem;}}
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:10px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      Toolkit
    </a>
    <span class="eyebrow">Working lexicon · C1</span>
  </div>

  <header>
    <h1>Phrasal <span class="accent">lexicon</span></h1>
    <p class="tag">All 154 verbs, browsable and searchable. The <b>particle</b> is highlighted in every entry — that's the little word doing the work.</p>
  </header>

  <div class="controls">
    <div class="searchrow">
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" type="search" placeholder="Search a verb or a meaning…" autocomplete="off">
      </label>
      <button class="modebtn" id="mode">Study →</button>
    </div>
    <div class="chips" id="chips"></div>
    <p class="count" id="count"></p>
  </div>

  <div class="list" id="list"></div>

  <div class="study" id="studyView">
    <div class="cardstage">
      <div class="flip" id="flip">
        <div class="face front"><span class="lab">Verb</span><div class="cardhw" id="cHw"></div><span class="hint">Tap to reveal</span></div>
        <div class="face back"><span class="lab">Meaning</span><div class="carddef" id="cDef"></div><span class="hint">Tap to flip back</span></div>
      </div>
    </div>
    <div class="nav">
      <button id="prev">← Prev</button>
      <span class="pos" id="pos"></span>
      <button id="next">Next →</button>
    </div>
    <button class="shuffle" id="shuffle">Shuffle deck</button>
  </div>
</div>

<script>
const DATA = [{"verb": "ask out", "def": "to invite someone on a romantic date"}, {"verb": "back down", "def": "to withdraw from a position or argument"}, {"verb": "back up", "def": "to support someone; to make a copy of data"}, {"verb": "blow up", "def": "to explode; to become very angry"}, {"verb": "break away", "def": "to escape or leave a group suddenly"}, {"verb": "break down", "def": "to stop functioning; to lose emotional control"}, {"verb": "break into", "def": "to enter a place by force; to start doing suddenly"}, {"verb": "break off", "def": "to end something suddenly"}, {"verb": "break out", "def": "to escape; to begin suddenly"}, {"verb": "break up", "def": "to end a relationship; to separate into pieces"}, {"verb": "bring about", "def": "to cause something to happen"}, {"verb": "bring back", "def": "to return something; to remind of the past"}, {"verb": "bring forward", "def": "to move an event to an earlier time"}, {"verb": "bring up", "def": "to mention a topic; to raise a child"}, {"verb": "burn out", "def": "to exhaust oneself through overwork"}, {"verb": "call back", "def": "to return a phone call"}, {"verb": "call off", "def": "to cancel something that was planned"}, {"verb": "call up", "def": "to telephone someone"}, {"verb": "calm down", "def": "to become less agitated or upset"}, {"verb": "carry on", "def": "to continue doing something"}, {"verb": "catch on", "def": "to understand; to become popular"}, {"verb": "catch up", "def": "to reach the same level as others"}, {"verb": "check in", "def": "to register at a hotel or airport"}, {"verb": "check out", "def": "to leave a hotel; to examine something closely"}, {"verb": "clean up", "def": "to tidy a place"}, {"verb": "clear out", "def": "to empty a space of its contents"}, {"verb": "close down", "def": "to cease operation permanently"}, {"verb": "come across", "def": "to find or meet someone by chance"}, {"verb": "come back", "def": "to return to a place"}, {"verb": "come down", "def": "to decrease; to travel south"}, {"verb": "come in", "def": "to enter a place; to arrive"}, {"verb": "come out", "def": "to be published; to reveal one's identity"}, {"verb": "come up with", "def": "to think of an idea or plan"}, {"verb": "count on", "def": "to rely on someone or something"}, {"verb": "cross out", "def": "to draw a line through something to cancel it"}, {"verb": "cut back", "def": "to reduce spending or consumption"}, {"verb": "cut down", "def": "to reduce the amount of something; to fell a tree"}, {"verb": "cut off", "def": "to stop abruptly; to interrupt someone"}, {"verb": "cut out", "def": "to stop doing something; to remove by cutting"}, {"verb": "deal with", "def": "to handle or take action about something"}, {"verb": "die out", "def": "to become extinct or gradually disappear"}, {"verb": "do away with", "def": "to abolish or eliminate something"}, {"verb": "do up", "def": "to fasten clothing; to renovate a building"}, {"verb": "draw up", "def": "to prepare a formal document"}, {"verb": "drop out", "def": "to leave school or a course before finishing"}, {"verb": "eat out", "def": "to have a meal in a restaurant"}, {"verb": "end up", "def": "to reach a final state or place unexpectedly"}, {"verb": "face up to", "def": "to accept and deal with something difficult"}, {"verb": "fall apart", "def": "to break into pieces; to fail completely"}, {"verb": "fall behind", "def": "to fail to keep pace with others"}, {"verb": "fall out", "def": "to quarrel with someone; to have a disagreement"}, {"verb": "feel up to", "def": "to feel capable of doing something"}, {"verb": "figure out", "def": "to understand or find a solution to something"}, {"verb": "fill in", "def": "to complete a form; to substitute for someone"}, {"verb": "find out", "def": "to discover or learn new information"}, {"verb": "get across", "def": "to communicate an idea successfully"}, {"verb": "get ahead", "def": "to make progress or succeed in life"}, {"verb": "get along", "def": "to have a good relationship with someone"}, {"verb": "get away", "def": "to escape; to go on a short holiday"}, {"verb": "get back", "def": "to return to a place; to recover something"}, {"verb": "get by", "def": "to manage with limited money or resources"}, {"verb": "get down", "def": "to depress someone; to descend from something"}, {"verb": "get in", "def": "to enter a vehicle or building; to arrive"}, {"verb": "get off", "def": "to leave a vehicle; to avoid punishment"}, {"verb": "get on", "def": "to board a vehicle; to make progress; to have a good relationship"}, {"verb": "get out", "def": "to leave a place; to escape"}, {"verb": "get over", "def": "to recover from an illness or disappointment"}, {"verb": "get through", "def": "to finish a task; to make contact with someone"}, {"verb": "get up", "def": "to rise from bed; to stand up"}, {"verb": "give away", "def": "to give something for free; to reveal a secret"}, {"verb": "give back", "def": "to return something to its owner"}, {"verb": "give in", "def": "to stop resisting; to surrender"}, {"verb": "give out", "def": "to distribute to a group; to run out of energy"}, {"verb": "give up", "def": "to stop trying; to quit something"}, {"verb": "go ahead", "def": "to proceed with a plan or action"}, {"verb": "go back", "def": "to return to a place or previous topic"}, {"verb": "go down", "def": "to decrease; to be remembered in history"}, {"verb": "go off", "def": "to explode; to ring an alarm; to go bad"}, {"verb": "go on", "def": "to continue; to happen or take place"}, {"verb": "go out", "def": "to leave the house to socialise; to be extinguished"}, {"verb": "go over", "def": "to review or examine something carefully"}, {"verb": "go through", "def": "to experience difficulty; to examine thoroughly"}, {"verb": "go up", "def": "to increase in amount; to be constructed"}, {"verb": "grow on", "def": "to become more liked or appreciated over time"}, {"verb": "grow up", "def": "to develop from a child into an adult"}, {"verb": "hang on", "def": "to wait a moment; to hold something tightly"}, {"verb": "hand in", "def": "to submit work or an assignment"}, {"verb": "hang up", "def": "to end a phone call; to hang clothing on a hook"}, {"verb": "have on", "def": "to be wearing something; to have something planned"}, {"verb": "head off", "def": "to intercept; to prevent something from happening"}, {"verb": "hold back", "def": "to restrain oneself or someone else; to hesitate"}, {"verb": "hold on", "def": "to wait; to grip something tightly"}, {"verb": "hold up", "def": "to delay; to rob; to remain strong under pressure"}, {"verb": "hurry up", "def": "to move or act more quickly"}, {"verb": "keep away", "def": "to stay or make someone stay at a distance"}, {"verb": "keep on", "def": "to continue doing something persistently"}, {"verb": "keep up", "def": "to maintain the same speed or standard"}, {"verb": "knock out", "def": "to make someone unconscious by a blow"}, {"verb": "leave out", "def": "to omit or not include something"}, {"verb": "let down", "def": "to disappoint someone who trusted you"}, {"verb": "let in", "def": "to allow someone to enter a place"}, {"verb": "let out", "def": "to release someone; to make a garment larger"}, {"verb": "light up", "def": "to illuminate a place; to brighten with happiness"}, {"verb": "line up", "def": "to arrange in a row; to queue"}, {"verb": "live up to", "def": "to meet expectations or standards set"}, {"verb": "look after", "def": "to take care of a person or thing"}, {"verb": "look around", "def": "to explore or examine an area"}, {"verb": "look at", "def": "to direct one's gaze at something"}, {"verb": "look forward to", "def": "to anticipate something with pleasure"}, {"verb": "look into", "def": "to investigate or research something"}, {"verb": "look out", "def": "to be careful; to watch for danger"}, {"verb": "look up", "def": "to search for information; to improve"}, {"verb": "make out", "def": "to manage; to understand; to see with difficulty"}, {"verb": "make over", "def": "to completely change the appearance of something"}, {"verb": "make up", "def": "to invent a story; to reconcile after a quarrel"}, {"verb": "meet up", "def": "to meet someone by prior arrangement"}, {"verb": "mix up", "def": "to confuse two things; to blend together"}, {"verb": "move on", "def": "to stop dwelling on the past and progress forward"}, {"verb": "open up", "def": "to become less reserved; to start operating"}, {"verb": "pass out", "def": "to faint; to hand something to several people"}, {"verb": "pay back", "def": "to repay money or a favour owed"}, {"verb": "pay off", "def": "to repay a debt fully; to yield good results"}, {"verb": "phase out", "def": "to gradually discontinue something"}, {"verb": "pick up", "def": "to collect someone; to learn a skill informally"}, {"verb": "play down", "def": "to make something seem less important than it is"}, {"verb": "point out", "def": "to draw attention to a fact or problem"}, {"verb": "pull off", "def": "to succeed in doing something difficult"}, {"verb": "put away", "def": "to store something in its proper place"}, {"verb": "put back", "def": "to return something to its original place"}, {"verb": "put down", "def": "to place something on a surface; to criticise"}, {"verb": "put off", "def": "to postpone; to cause dislike or loss of interest"}, {"verb": "put on", "def": "to dress in clothing; to pretend; to gain weight"}, {"verb": "put out", "def": "to extinguish a fire; to inconvenience someone"}, {"verb": "put up with", "def": "to tolerate something or someone unpleasant"}, {"verb": "read out", "def": "to read something aloud to others"}, {"verb": "run away", "def": "to flee from a place or person"}, {"verb": "run into", "def": "to meet someone unexpectedly"}, {"verb": "run out of", "def": "to use all of something so none remains"}, {"verb": "save up", "def": "to accumulate money gradually over time"}, {"verb": "set off", "def": "to begin a journey; to cause something to start"}, {"verb": "set up", "def": "to arrange or establish something"}, {"verb": "show off", "def": "to boast about or display something proudly"}, {"verb": "shut down", "def": "to stop a machine or operation"}, {"verb": "sort out", "def": "to resolve a problem or organise things neatly"}, {"verb": "speed up", "def": "to go or do something faster"}, {"verb": "stand out", "def": "to be clearly noticeable or better than others"}, {"verb": "step down", "def": "to resign from a position or responsibility"}, {"verb": "sum up", "def": "to summarise the main points of something"}, {"verb": "take off", "def": "to remove clothing; to become suddenly successful"}, {"verb": "take on", "def": "to accept a responsibility or task"}, {"verb": "take over", "def": "to take control of something"}, {"verb": "turn down", "def": "to reject an offer; to lower the volume"}, {"verb": "wear out", "def": "to exhaust someone; to make unusable through use"}, {"verb": "work out", "def": "to exercise; to calculate; to result successfully"}];
const PARTS = {};
DATA.forEach(d=>{const p=d.verb.split(" ").slice(-1)[0];(PARTS[p]=PARTS[p]||0);PARTS[p]++;});
const topParts = Object.entries(PARTS).sort((a,b)=>b[1]-a[1]).slice(0,9).map(x=>x[0]);

let activePart=null, query="", studyMode=false, deck=[], idx=0;

const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function splitVerb(v){const parts=v.split(" ");return {stem:parts.slice(0,-1).join(" "),part:parts.slice(-1)[0]};}
function hl(text,q){if(!q)return esc(text);const i=text.toLowerCase().indexOf(q.toLowerCase());
  if(i<0)return esc(text);return esc(text.slice(0,i))+"<mark>"+esc(text.slice(i,i+q.length))+"</mark>"+esc(text.slice(i+q.length));}

function filtered(){
  return DATA.filter(d=>{
    if(activePart && d.verb.split(" ").slice(-1)[0]!==activePart) return false;
    if(query){const q=query.toLowerCase();
      if(!d.verb.toLowerCase().includes(q) && !d.def.toLowerCase().includes(q)) return false;}
    return true;
  });
}

function renderChips(){
  const c=document.getElementById("chips");
  c.innerHTML="";
  const all=document.createElement("button");
  all.className="chip"+(activePart?"":" on");all.innerHTML="all <span class=n>"+DATA.length+"</span>";
  all.onclick=()=>{activePart=null;render();};c.appendChild(all);
  topParts.forEach(p=>{const b=document.createElement("button");
    b.className="chip"+(activePart===p?" on":"");b.innerHTML=p+" <span class=n>"+PARTS[p]+"</span>";
    b.onclick=()=>{activePart=activePart===p?null:p;render();};c.appendChild(b);});
}

function renderList(){
  const rows=filtered();const L=document.getElementById("list");
  document.getElementById("count").textContent=rows.length+" of "+DATA.length+" entries"+(activePart?" · “"+activePart+"”":"");
  if(!rows.length){L.innerHTML='<div class="empty"><b>No matches</b>Try a different word, or clear the filter.</div>';return;}
  L.innerHTML=rows.map(d=>{const{stem,part}=splitVerb(d.verb);
    const defHtml=d.def.split(";").map(s=>hl(s.trim(),query)).join('<span class="alt">/</span>');
    return '<div class="entry"><div class="hw"><span class="stem">'+hl(stem,query)+
      ' </span><span class="part">'+hl(part,query)+'</span></div><div class="def">'+defHtml+'</div></div>';}).join("");
}

/* study */
function buildDeck(){deck=filtered().slice();idx=0;showCard();}
function showCard(){
  if(!deck.length){document.getElementById("cHw").textContent="—";document.getElementById("cDef").textContent="No cards";
    document.getElementById("pos").textContent="0 / 0";return;}
  if(idx<0)idx=deck.length-1; if(idx>=deck.length)idx=0;
  const d=deck[idx];const{stem,part}=splitVerb(d.verb);
  document.getElementById("cHw").innerHTML='<span class="stem">'+esc(stem)+' </span><span class="part">'+esc(part)+'</span>';
  document.getElementById("cDef").textContent=d.def;
  document.getElementById("pos").textContent=(idx+1)+" / "+deck.length;
  document.getElementById("flip").classList.remove("flipped");
}
document.getElementById("flip").onclick=()=>document.getElementById("flip").classList.toggle("flipped");
document.getElementById("next").onclick=()=>{idx++;showCard();};
document.getElementById("prev").onclick=()=>{idx--;showCard();};
document.getElementById("shuffle").onclick=()=>{for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}idx=0;showCard();};

function render(){renderChips();if(studyMode){buildDeck();}else{renderList();}}

document.getElementById("q").addEventListener("input",e=>{query=e.target.value;render();});
document.getElementById("mode").onclick=()=>{
  studyMode=!studyMode;
  document.getElementById("list").style.display=studyMode?"none":"block";
  document.getElementById("studyView").classList.toggle("on",studyMode);
  document.getElementById("mode").innerHTML=studyMode?"← Browse":"Study →";
  render();
};
document.addEventListener("keydown",e=>{
  if(!studyMode)return;
  if(e.key==="ArrowRight"){idx++;showCard();}
  if(e.key==="ArrowLeft"){idx--;showCard();}
  if(e.key===" "){e.preventDefault();document.getElementById("flip").classList.toggle("flipped");}
});

render();
</script>
</body>
</html>
