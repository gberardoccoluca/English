<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phrasal Verbs Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --desk:#D9D6CB;
    --desk-2:#CFCCC0;
    --card:#FFFEFB;
    --rule:#C7DAEC;
    --margin:#E59089;
    --ink:#1B2B44;
    --ink-soft:#5C6B80;
    --ink-faint:#9AA6B6;
    --accent:#C0533C;
    --correct:#2F7A53;
    --correct-bg:#E7F2EB;
    --wrong:#C0392B;
    --wrong-bg:#FBEAE8;
    --shadow:0 1px 0 rgba(0,0,0,.04), 0 12px 30px -16px rgba(27,43,68,.45);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:'Hanken Grotesk',system-ui,sans-serif;
    background:
      radial-gradient(120% 120% at 50% -10%, var(--desk) 0%, var(--desk-2) 100%);
    color:var(--ink);
    min-height:100%;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:32px 18px 48px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%;max-width:580px}

  /* Header */
  header{margin-bottom:18px}
  .eyebrow{
    font-family:'Spline Sans Mono',monospace;
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--ink-soft);margin:0 0 6px;
  }
  h1{
    font-family:'Hanken Grotesk',sans-serif;
    font-weight:700;font-size:clamp(26px,6vw,34px);
    margin:0;letter-spacing:-.01em;line-height:1.05;
  }
  h1 .p{color:var(--accent)}

  /* The card */
  .card{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
    border:1px solid rgba(27,43,68,.08);
  }
  /* ruled lines + red margin */
  .card::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,transparent 0,transparent 37px,var(--rule) 37px,var(--rule) 38px);
    opacity:.5;
  }
  .card::after{
    content:"";position:absolute;top:0;bottom:0;left:46px;width:2px;
    background:var(--margin);opacity:.55;pointer-events:none;
  }
  .card-inner{position:relative;padding:26px 26px 26px 64px}
  @media(max-width:460px){
    .card::after{left:30px}
    .card-inner{padding:22px 18px 22px 44px}
  }

  /* Setup screen */
  .setup .lead{color:var(--ink-soft);margin:2px 0 22px;font-size:15px;line-height:1.5}
  .field{margin-bottom:20px}
  .field > .lbl{
    font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:9px;
  }
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    appearance:none;cursor:pointer;border:1.5px solid rgba(27,43,68,.16);
    background:transparent;color:var(--ink);
    font-family:inherit;font-size:14px;font-weight:500;
    padding:9px 14px;border-radius:999px;transition:.15s;
  }
  .chip:hover{border-color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip .sub{display:block;font-size:11px;color:var(--ink-faint);font-weight:400}
  .chip[aria-pressed="true"] .sub{color:rgba(255,255,255,.7)}

  .btn{
    appearance:none;cursor:pointer;border:none;width:100%;
    font-family:inherit;font-size:16px;font-weight:600;
    background:var(--accent);color:#fff;padding:14px;border-radius:11px;
    transition:transform .12s,filter .12s;margin-top:6px;
  }
  .btn:hover{filter:brightness(1.06)}
  .btn:active{transform:translateY(1px)}
  .btn.secondary{background:transparent;color:var(--ink);border:1.5px solid rgba(27,43,68,.2)}

  /* Quiz screen */
  .meter{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .bar{flex:1;height:6px;border-radius:99px;background:rgba(27,43,68,.1);overflow:hidden}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .35s ease}
  .count{font-family:'Spline Sans Mono',monospace;font-size:12px;color:var(--ink-soft);white-space:nowrap}

  .prompt-kind{
    font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--ink-soft);margin:0 0 6px;
  }
  .prompt{
    font-size:clamp(22px,5.4vw,30px);line-height:1.18;margin:0 0 22px;font-weight:600;
    letter-spacing:-.01em;min-height:1.2em;
  }
  .prompt.verb{font-family:'Spline Sans Mono',monospace;font-weight:600}
  .prompt.verb .p{color:var(--accent)}

  .answers{display:flex;flex-direction:column;gap:10px}
  .ans{
    appearance:none;text-align:left;cursor:pointer;width:100%;
    background:#fff;border:1.5px solid rgba(27,43,68,.16);border-radius:11px;
    font-family:inherit;font-size:15px;color:var(--ink);padding:13px 14px 13px 44px;
    position:relative;transition:.13s;line-height:1.35;
  }
  .ans .key{
    position:absolute;left:13px;top:50%;transform:translateY(-50%);
    font-family:'Spline Sans Mono',monospace;font-size:12px;color:var(--ink-faint);
    border:1px solid rgba(27,43,68,.18);border-radius:6px;width:20px;height:20px;
    display:grid;place-items:center;transition:.13s;
  }
  .ans.verb-opt{font-family:'Spline Sans Mono',monospace}
  .ans:not(:disabled):hover{border-color:var(--ink)}
  .ans:not(:disabled):hover .key{border-color:var(--ink);color:var(--ink)}
  .ans:disabled{cursor:default}
  .ans.correct{background:var(--correct-bg);border-color:var(--correct);color:var(--correct);font-weight:600}
  .ans.correct .key{border-color:var(--correct);color:var(--correct)}
  .ans.wrong{background:var(--wrong-bg);border-color:var(--wrong);color:var(--wrong)}
  .ans.wrong .key{border-color:var(--wrong);color:var(--wrong)}
  .ans .mark{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-weight:700}

  .next-row{margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
  .scoreline{font-family:'Spline Sans Mono',monospace;font-size:13px;color:var(--ink-soft)}
  .scoreline b{color:var(--correct)}
  .nextbtn{
    appearance:none;cursor:pointer;border:none;background:var(--ink);color:#fff;
    font-family:inherit;font-weight:600;font-size:14px;padding:11px 22px;border-radius:10px;transition:.12s;
  }
  .nextbtn:hover{filter:brightness(1.15)}
  .nextbtn[hidden]{display:none}
  .hint{font-family:'Spline Sans Mono',monospace;font-size:11px;color:var(--ink-faint);text-align:center;margin-top:14px}

  /* Results */
  .result .big{font-size:clamp(46px,12vw,64px);font-weight:700;line-height:1;margin:6px 0 2px;letter-spacing:-.02em}
  .result .pct{color:var(--accent)}
  .result .sub{color:var(--ink-soft);margin:0 0 4px;font-size:15px}
  .review{margin:22px 0 6px}
  .review h3{
    font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-soft);margin:0 0 10px;
  }
  .miss{padding:11px 0;border-top:1px solid rgba(27,43,68,.1)}
  .miss .mv{font-family:'Spline Sans Mono',monospace;font-weight:600;color:var(--accent);font-size:15px}
  .miss .md{color:var(--ink-soft);font-size:14px;margin-top:2px;line-height:1.4}
  .allright{color:var(--correct);font-weight:600;font-size:15px;margin:18px 0 6px}
  .btn-row{display:flex;gap:10px;margin-top:18px}
  .btn-row .btn{margin-top:0}

  footer{text-align:center;margin-top:18px;font-family:'Spline Sans Mono',monospace;
    font-size:11px;color:var(--ink-faint);letter-spacing:.04em}

  :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Vocabulary drill</p>
    <h1>Phrasal Verbs <span class="p">Quiz</span></h1>
  </header>

  <div class="card"><div class="card-inner" id="stage"></div></div>

  <footer id="foot">151 entries loaded</footer>
</div>

<script>
const DATA = [{"v":"ask out","d":"to invite someone on a romantic date"},{"v":"back down","d":"to withdraw from a position or argument"},{"v":"back up","d":"to support someone; to make a copy of data"},{"v":"blow up","d":"to explode; to become very angry"},{"v":"break away","d":"to escape or leave a group suddenly"},{"v":"break down","d":"to stop functioning; to lose emotional control"},{"v":"break into","d":"to enter a place by force; to start doing suddenly"},{"v":"break off","d":"to end something suddenly"},{"v":"break out","d":"to escape; to begin suddenly"},{"v":"break up","d":"to end a relationship; to separate into pieces"},{"v":"bring about","d":"to cause something to happen"},{"v":"bring back","d":"to return something; to remind of the past"},{"v":"bring forward","d":"to move an event to an earlier time"},{"v":"bring up","d":"to mention a topic; to raise a child"},{"v":"burn out","d":"to exhaust oneself through overwork"},{"v":"call back","d":"to return a phone call"},{"v":"call off","d":"to cancel something that was planned"},{"v":"call up","d":"to telephone someone"},{"v":"calm down","d":"to become less agitated or upset"},{"v":"carry on","d":"to continue doing something"},{"v":"catch on","d":"to understand; to become popular"},{"v":"catch up","d":"to reach the same level as others"},{"v":"check in","d":"to register at a hotel or airport"},{"v":"check out","d":"to leave a hotel; to examine something closely"},{"v":"clean up","d":"to tidy a place"},{"v":"clear out","d":"to empty a space of its contents"},{"v":"close down","d":"to cease operation permanently"},{"v":"come across","d":"to find or meet someone by chance"},{"v":"come back","d":"to return to a place"},{"v":"come down","d":"to decrease; to travel south"},{"v":"come in","d":"to enter a place; to arrive"},{"v":"come out","d":"to be published; to reveal one's identity"},{"v":"come up with","d":"to think of an idea or plan"},{"v":"count on","d":"to rely on someone or something"},{"v":"cross out","d":"to draw a line through something to cancel it"},{"v":"cut back","d":"to reduce spending or consumption"},{"v":"cut down","d":"to reduce the amount of something; to fell a tree"},{"v":"cut off","d":"to stop abruptly; to interrupt someone"},{"v":"cut out","d":"to stop doing something; to remove by cutting"},{"v":"deal with","d":"to handle or take action about something"},{"v":"die out","d":"to become extinct or gradually disappear"},{"v":"do away with","d":"to abolish or eliminate something"},{"v":"do up","d":"to fasten clothing; to renovate a building"},{"v":"draw up","d":"to prepare a formal document"},{"v":"drop out","d":"to leave school or a course before finishing"},{"v":"eat out","d":"to have a meal in a restaurant"},{"v":"end up","d":"to reach a final state or place unexpectedly"},{"v":"face up to","d":"to accept and deal with something difficult"},{"v":"fall apart","d":"to break into pieces; to fail completely"},{"v":"fall behind","d":"to fail to keep pace with others"},{"v":"fall out","d":"to quarrel with someone; to have a disagreement"},{"v":"feel up to","d":"to feel capable of doing something"},{"v":"figure out","d":"to understand or find a solution to something"},{"v":"fill in","d":"to complete a form; to substitute for someone"},{"v":"find out","d":"to discover or learn new information"},{"v":"get across","d":"to communicate an idea successfully"},{"v":"get ahead","d":"to make progress or succeed in life"},{"v":"get along","d":"to have a good relationship with someone"},{"v":"get away","d":"to escape; to go on a short holiday"},{"v":"get back","d":"to return to a place; to recover something"},{"v":"get by","d":"to manage with limited money or resources"},{"v":"get down","d":"to depress someone; to descend from something"},{"v":"get in","d":"to enter a vehicle or building; to arrive"},{"v":"get off","d":"to leave a vehicle; to avoid punishment"},{"v":"get on","d":"to board a vehicle; to make progress; to have a good relationship"},{"v":"get out","d":"to leave a place; to escape"},{"v":"get over","d":"to recover from an illness or disappointment"},{"v":"get through","d":"to finish a task; to make contact with someone"},{"v":"get up","d":"to rise from bed; to stand up"},{"v":"give away","d":"to give something for free; to reveal a secret"},{"v":"give back","d":"to return something to its owner"},{"v":"give in","d":"to stop resisting; to surrender"},{"v":"give out","d":"to distribute to a group; to run out of energy"},{"v":"give up","d":"to stop trying; to quit something"},{"v":"go ahead","d":"to proceed with a plan or action"},{"v":"go back","d":"to return to a place or previous topic"},{"v":"go down","d":"to decrease; to be remembered in history"},{"v":"go off","d":"to explode; to ring an alarm; to go bad"},{"v":"go on","d":"to continue; to happen or take place"},{"v":"go out","d":"to leave the house to socialise; to be extinguished"},{"v":"go over","d":"to review or examine something carefully"},{"v":"go through","d":"to experience difficulty; to examine thoroughly"},{"v":"go up","d":"to increase in amount; to be constructed"},{"v":"grow on","d":"to become more liked or appreciated over time"},{"v":"grow up","d":"to develop from a child into an adult"},{"v":"hang on","d":"to wait a moment; to hold something tightly"},{"v":"hand in","d":"to submit work or an assignment"},{"v":"hang up","d":"to end a phone call; to hang clothing on a hook"},{"v":"have on","d":"to be wearing something; to have something planned"},{"v":"head off","d":"to intercept; to prevent something from happening"},{"v":"hold back","d":"to restrain oneself or someone else; to hesitate"},{"v":"hold on","d":"to wait; to grip something tightly"},{"v":"hold up","d":"to delay; to rob; to remain strong under pressure"},{"v":"hurry up","d":"to move or act more quickly"},{"v":"keep away","d":"to stay or make someone stay at a distance"},{"v":"keep on","d":"to continue doing something persistently"},{"v":"keep up","d":"to maintain the same speed or standard"},{"v":"knock out","d":"to make someone unconscious by a blow"},{"v":"leave out","d":"to omit or not include something"},{"v":"let down","d":"to disappoint someone who trusted you"},{"v":"let in","d":"to allow someone to enter a place"},{"v":"let out","d":"to release someone; to make a garment larger"},{"v":"light up","d":"to illuminate a place; to brighten with happiness"},{"v":"line up","d":"to arrange in a row; to queue"},{"v":"live up to","d":"to meet expectations or standards set"},{"v":"look after","d":"to take care of a person or thing"},{"v":"look around","d":"to explore or examine an area"},{"v":"look at","d":"to direct one's gaze at something"},{"v":"look forward to","d":"to anticipate something with pleasure"},{"v":"look into","d":"to investigate or research something"},{"v":"look out","d":"to be careful; to watch for danger"},{"v":"look up","d":"to search for information; to improve"},{"v":"make out","d":"to manage; to understand; to see with difficulty"},{"v":"make over","d":"to completely change the appearance of something"},{"v":"make up","d":"to invent a story; to reconcile after a quarrel"},{"v":"meet up","d":"to meet someone by prior arrangement"},{"v":"mix up","d":"to confuse two things; to blend together"},{"v":"move on","d":"to stop dwelling on the past and progress forward"},{"v":"open up","d":"to become less reserved; to start operating"},{"v":"pass out","d":"to faint; to hand something to several people"},{"v":"pay back","d":"to repay money or a favour owed"},{"v":"pay off","d":"to repay a debt fully; to yield good results"},{"v":"phase out","d":"to gradually discontinue something"},{"v":"pick up","d":"to collect someone; to learn a skill informally"},{"v":"play down","d":"to make something seem less important than it is"},{"v":"point out","d":"to draw attention to a fact or problem"},{"v":"pull off","d":"to succeed in doing something difficult"},{"v":"put away","d":"to store something in its proper place"},{"v":"put back","d":"to return something to its original place"},{"v":"put down","d":"to place something on a surface; to criticise"},{"v":"put off","d":"to postpone; to cause dislike or loss of interest"},{"v":"put on","d":"to dress in clothing; to pretend; to gain weight"},{"v":"put out","d":"to extinguish a fire; to inconvenience someone"},{"v":"put up with","d":"to tolerate something or someone unpleasant"},{"v":"read out","d":"to read something aloud to others"},{"v":"run away","d":"to flee from a place or person"},{"v":"run into","d":"to meet someone unexpectedly"},{"v":"run out of","d":"to use all of something so none remains"},{"v":"save up","d":"to accumulate money gradually over time"},{"v":"set off","d":"to begin a journey; to cause something to start"},{"v":"set up","d":"to arrange or establish something"},{"v":"show off","d":"to boast about or display something proudly"},{"v":"shut down","d":"to stop a machine or operation"},{"v":"sort out","d":"to resolve a problem or organise things neatly"},{"v":"speed up","d":"to go or do something faster"},{"v":"stand out","d":"to be clearly noticeable or better than others"},{"v":"sum up","d":"to summarise the main points of something"},{"v":"take off","d":"to remove clothing; to become suddenly successful"},{"v":"turn down","d":"to reject an offer; to lower the volume"},{"v":"wear out","d":"to exhaust someone; to make unusable through use"},{"v":"work out","d":"to exercise; to calculate; to result successfully"}];
const stage = document.getElementById('stage');
const foot = document.getElementById('foot');
foot.textContent = DATA.length + " phrasal verbs loaded";

let cfg = { dir:'mixed', len:10 };
let quiz = [], idx = 0, score = 0, locked = false, misses = [];

const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
const LETTERS = ['A','B','C','D'];

// highlight the particle(s) of a phrasal verb
function fmtVerb(v){
  const parts = v.split(' ');
  if(parts.length<2) return `<span>${v}</span>`;
  return `<span>${parts[0]}</span> <span class="p">${parts.slice(1).join(' ')}</span>`;
}

function buildQuiz(){
  const pool = shuffle(DATA).slice(0, Math.min(cfg.len, DATA.length));
  quiz = pool.map(item => {
    const dir = cfg.dir==='mixed' ? (Math.random()<.5?'v2d':'d2v') : cfg.dir;
    // distractors from other items
    const others = shuffle(DATA.filter(x => x.v!==item.v));
    if(dir==='v2d'){
      const distract = pickDistinct(others, item, 'd', 3);
      const choices = shuffle([{t:item.d,ok:true}, ...distract.map(x=>({t:x.d,ok:false}))]);
      return {kind:'v2d', promptText:item.v, choices, answer:item.d, item};
    } else {
      const distract = pickDistinct(others, item, 'v', 3);
      const choices = shuffle([{t:item.v,ok:true}, ...distract.map(x=>({t:x.v,ok:false}))]);
      return {kind:'d2v', promptText:item.d, choices, answer:item.v, item};
    }
  });
}
// avoid duplicate option texts
function pickDistinct(others, item, key, n){
  const out=[], seen=new Set([item[key]]);
  for(const o of others){ if(out.length>=n) break; if(!seen.has(o[key])){seen.add(o[key]); out.push(o);} }
  return out;
}

/* ---------- Screens ---------- */
function renderSetup(){
  locked=false;
  stage.innerHTML = `
    <div class="setup">
      <p class="lead">Test yourself in either direction. Pick a mode and length, then answer the multiple-choice questions.</p>
      <div class="field">
        <span class="lbl">Direction</span>
        <div class="opts" id="dir">
          <button class="chip" data-v="v2d">Verb &rarr; meaning<span class="sub">see the verb, pick the definition</span></button>
          <button class="chip" data-v="d2v">Meaning &rarr; verb<span class="sub">see the definition, pick the verb</span></button>
          <button class="chip" data-v="mixed">Mixed<span class="sub">both, at random</span></button>
        </div>
      </div>
      <div class="field">
        <span class="lbl">Questions</span>
        <div class="opts" id="len">
          <button class="chip" data-v="10">10</button>
          <button class="chip" data-v="20">20</button>
          <button class="chip" data-v="${DATA.length}">All ${DATA.length}</button>
        </div>
      </div>
      <button class="btn" id="start">Start quiz</button>
    </div>`;

  syncChips('dir', String(cfg.dir));
  syncChips('len', String(cfg.len));
  stage.querySelector('#dir').onclick = e=>{const b=e.target.closest('.chip'); if(!b)return; cfg.dir=b.dataset.v; syncChips('dir',cfg.dir);};
  stage.querySelector('#len').onclick = e=>{const b=e.target.closest('.chip'); if(!b)return; cfg.len=+b.dataset.v; syncChips('len',String(cfg.len));};
  stage.querySelector('#start').onclick = startQuiz;
}
function syncChips(group, val){
  stage.querySelectorAll('#'+group+' .chip').forEach(c=>c.setAttribute('aria-pressed', c.dataset.v===val));
}

function startQuiz(){
  buildQuiz(); idx=0; score=0; misses=[]; renderQuestion();
}

function renderQuestion(){
  locked=false;
  const q = quiz[idx];
  const isVerbPrompt = q.kind==='v2d';
  const optClass = q.kind==='d2v' ? 'verb-opt' : '';
  stage.innerHTML = `
    <div class="quiz">
      <div class="meter">
        <div class="bar"><i style="width:${(idx/quiz.length)*100}%"></i></div>
        <span class="count">${idx+1} / ${quiz.length}</span>
      </div>
      <p class="prompt-kind">${isVerbPrompt?'What does this mean?':'Which phrasal verb means&hellip;'}</p>
      <p class="prompt ${isVerbPrompt?'verb':''}">${isVerbPrompt?fmtVerb(q.promptText):q.promptText}</p>
      <div class="answers" id="answers">
        ${q.choices.map((c,i)=>`
          <button class="ans ${optClass}" data-i="${i}">
            <span class="key">${LETTERS[i]}</span>
            <span class="txt">${escapeHtml(c.t)}</span>
            <span class="mark"></span>
          </button>`).join('')}
      </div>
      <div class="next-row">
        <span class="scoreline">Score <b>${score}</b> / ${quiz.length}</span>
        <button class="nextbtn" id="next" hidden>${idx+1<quiz.length?'Next &rarr;':'See results'}</button>
      </div>
      <p class="hint">Press 1&ndash;4 to answer &middot; Enter for next</p>
    </div>`;
  stage.querySelector('#answers').addEventListener('click', e=>{
    const b=e.target.closest('.ans'); if(b) choose(+b.dataset.i);
  });
  stage.querySelector('#next').onclick = advance;
}

function choose(i){
  if(locked) return; locked=true;
  const q = quiz[idx];
  const btns = [...stage.querySelectorAll('.ans')];
  btns.forEach(b=>b.disabled=true);
  const picked = q.choices[i];
  if(picked.ok){
    score++;
    btns[i].classList.add('correct');
    btns[i].querySelector('.mark').textContent='✓';
  } else {
    btns[i].classList.add('wrong');
    btns[i].querySelector('.mark').textContent='✗';
    const ci = q.choices.findIndex(c=>c.ok);
    btns[ci].classList.add('correct');
    btns[ci].querySelector('.mark').textContent='✓';
    misses.push(q);
  }
  stage.querySelector('.scoreline b').textContent = score;
  const nx = stage.querySelector('#next'); nx.hidden=false; nx.focus();
}

function advance(){
  idx++;
  if(idx>=quiz.length) renderResults();
  else renderQuestion();
}

function renderResults(){
  const pct = Math.round(score/quiz.length*100);
  const msg = pct===100?'Flawless.':pct>=80?'Strong work.':pct>=60?'Solid — keep drilling.':pct>=40?'Getting there.':'Worth another round.';
  const reviewHtml = misses.length ? `
    <div class="review">
      <h3>Review &mdash; ${misses.length} to revisit</h3>
      ${misses.map(m=>`<div class="miss"><div class="mv">${escapeHtml(m.item.v)}</div><div class="md">${escapeHtml(m.item.d)}</div></div>`).join('')}
    </div>` : `<p class="allright">No misses — every answer correct.</p>`;
  stage.innerHTML = `
    <div class="result">
      <p class="prompt-kind">Results</p>
      <div class="big"><span class="pct">${pct}%</span></div>
      <p class="sub">${score} of ${quiz.length} correct &middot; ${msg}</p>
      ${reviewHtml}
      <div class="btn-row">
        <button class="btn secondary" id="again">Retry missed</button>
        <button class="btn" id="restart">New quiz</button>
      </div>
    </div>`;
  stage.querySelector('#restart').onclick = renderSetup;
  const againBtn = stage.querySelector('#again');
  if(!misses.length){ againBtn.disabled=true; againBtn.style.opacity=.4; againBtn.style.cursor='default'; }
  else againBtn.onclick = ()=>{
    quiz = shuffle(misses).map(m=>({...m, choices:shuffle(m.choices)}));
    idx=0; score=0; misses=[]; renderQuestion();
  };
}

function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

// keyboard
document.addEventListener('keydown', e=>{
  if(['1','2','3','4'].includes(e.key)){
    const b=stage.querySelector(`.ans[data-i="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1);
  } else if(e.key==='Enter'){
    const nx=stage.querySelector('#next'); if(nx&&!nx.hidden){e.preventDefault();advance();}
    const st=stage.querySelector('#start'); if(st){e.preventDefault();startQuiz();}
  }
});

renderSetup();
</script>
</body>
</html>
